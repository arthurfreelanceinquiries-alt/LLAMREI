[package]
name = "llamrei-dashboard"
version = "0.1.0"
description = "Personal Dashboard Llamrei — ClickUp Workspace, Task Alarms, Llamrei Agent, Scheduled Chats & NectarLink Phone Hub"
authors = ["Arthur Reezan"]
edition = "2021"

[lib]
name = "llamrei_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
